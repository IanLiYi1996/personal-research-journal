<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1a2b4a">并行策略 → 硬件层级映射 (通信量大的贴近快链路)</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#666">原则：TP/EP(每层多次、延迟敏感)放节点内 NVLink；DP/PP(每步一次)可跨节点 IB</text>

  <!-- bandwidth ladder -->
  <rect x="40" y="80" width="330" height="360" rx="10" fill="#fafbff" stroke="#ccd"/>
  <text x="205" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2b4a">带宽阶梯 (快→慢)</text>

  <rect x="65" y="120" width="280" height="60" rx="6" fill="#bfe8cd" stroke="#2f9e5a"/>
  <text x="205" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#1a4a2b">节点内 NVLink ~450 GB/s/GPU</text>
  <text x="205" y="166" text-anchor="middle" font-size="12" fill="#2f6a4a">→ 放 Tensor / Expert Parallel</text>

  <rect x="65" y="196" width="280" height="60" rx="6" fill="#c9dcff" stroke="#3b6fd4"/>
  <text x="205" y="221" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2b4a">节点间 IB ~400 GB/s/节点</text>
  <text x="205" y="242" text-anchor="middle" font-size="12" fill="#3a4a6a">→ 放 Pipeline / Data Parallel</text>

  <rect x="65" y="272" width="280" height="60" rx="6" fill="#ffe7b3" stroke="#d4a63b"/>
  <text x="205" y="297" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5200">跨机架 spine / 超订区</text>
  <text x="205" y="318" text-anchor="middle" font-size="12" fill="#8a6a20">→ 放 Data Parallel 最外层</text>

  <rect x="65" y="348" width="280" height="60" rx="6" fill="#ffd4bf" stroke="#d4763b"/>
  <text x="205" y="373" text-anchor="middle" font-size="13" font-weight="700" fill="#7a3a20">DCN / 跨 Pod (最慢)</text>
  <text x="205" y="394" text-anchor="middle" font-size="12" fill="#8a4a20">→ 梯度累加 / 异步 DP</text>

  <!-- device mesh example -->
  <rect x="400" y="80" width="460" height="360" rx="10" fill="#fafbff" stroke="#ccd"/>
  <text x="630" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2b4a">Device Mesh 示例：64 GPU = 2×4×8</text>
  <text x="630" y="124" text-anchor="middle" font-size="12" fill="#666">(DP=2) × (PP=4) × (TP=8)，TP 恰好落在一个 8-GPU 节点内</text>

  <!-- draw 2 DP groups, each 4 PP stages x (node of 8) -->
  <g font-size="10">
    <!-- DP group 0 -->
    <text x="430" y="150" font-size="12" font-weight="700" fill="#3b6fd4">DP replica 0</text>
    <g>
      <rect x="430" y="158" width="180" height="46" rx="4" fill="#eef4ff" stroke="#2f9e5a"/><text x="520" y="176" text-anchor="middle" font-size="11" fill="#1a4a2b">PP stage0 · TP=8 (节点A)</text><text x="520" y="194" text-anchor="middle" font-size="10" fill="#888">8×NVLink 全互联</text>
      <rect x="430" y="210" width="180" height="46" rx="4" fill="#eef4ff" stroke="#2f9e5a"/><text x="520" y="228" text-anchor="middle" font-size="11" fill="#1a4a2b">PP stage1 · TP=8 (节点B)</text>
      <rect x="430" y="262" width="180" height="46" rx="4" fill="#eef4ff" stroke="#2f9e5a"/><text x="520" y="280" text-anchor="middle" font-size="11" fill="#1a4a2b">PP stage2 · TP=8 (节点C)</text>
      <rect x="430" y="314" width="180" height="46" rx="4" fill="#eef4ff" stroke="#2f9e5a"/><text x="520" y="332" text-anchor="middle" font-size="11" fill="#1a4a2b">PP stage3 · TP=8 (节点D)</text>
      <path d="M520 204 V210" stroke="#3b6fd4" stroke-width="2" marker-end="url(#b)"/>
      <path d="M520 256 V262" stroke="#3b6fd4" stroke-width="2" marker-end="url(#b)"/>
      <path d="M520 308 V314" stroke="#3b6fd4" stroke-width="2" marker-end="url(#b)"/>
    </g>
    <!-- DP group 1 -->
    <text x="650" y="150" font-size="12" font-weight="700" fill="#3b6fd4">DP replica 1</text>
    <g>
      <rect x="650" y="158" width="180" height="46" rx="4" fill="#fff3f0" stroke="#2f9e5a"/><text x="740" y="176" text-anchor="middle" font-size="11" fill="#7a3a20">PP stage0 · TP=8 (节点E)</text>
      <rect x="650" y="210" width="180" height="46" rx="4" fill="#fff3f0" stroke="#2f9e5a"/><text x="740" y="228" text-anchor="middle" font-size="11" fill="#7a3a20">PP stage1 · TP=8 (节点F)</text>
      <rect x="650" y="262" width="180" height="46" rx="4" fill="#fff3f0" stroke="#2f9e5a"/><text x="740" y="280" text-anchor="middle" font-size="11" fill="#7a3a20">PP stage2 · TP=8 (节点G)</text>
      <rect x="650" y="314" width="180" height="46" rx="4" fill="#fff3f0" stroke="#2f9e5a"/><text x="740" y="332" text-anchor="middle" font-size="11" fill="#7a3a20">PP stage3 · TP=8 (节点H)</text>
    </g>
    <!-- DP allreduce arrow -->
    <path d="M610 175 H650" stroke="#d43b3b" stroke-width="2" marker-end="url(#r)"/>
    <path d="M650 190 H610" stroke="#d43b3b" stroke-width="2" marker-end="url(#r)"/>
    <text x="630" y="400" text-anchor="middle" font-size="11" font-weight="700" fill="#d43b3b">DP All-Reduce 梯度 (跨副本，最外层)</text>
    <text x="630" y="420" text-anchor="middle" font-size="11" fill="#3b6fd4">PP send/recv 沿 stage 竖向传激活</text>
  </g>

  <defs>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3b6fd4"/></marker>
    <marker id="r" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#d43b3b"/></marker>
  </defs>
</svg>
