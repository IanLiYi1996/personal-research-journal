<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2b4a">四种基本并行维度 (拆什么 × 用什么集合操作)</text>

  <!-- Data Parallel -->
  <g>
    <rect x="30" y="60" width="400" height="220" rx="10" fill="#eef4ff" stroke="#3b6fd4" stroke-width="1.5"/>
    <text x="230" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2b4a">Data Parallel (DP) — 拆 batch</text>
    <!-- two replicas -->
    <rect x="55" y="105" width="150" height="120" rx="8" fill="#ffffff" stroke="#3b6fd4"/>
    <rect x="255" y="105" width="150" height="120" rx="8" fill="#ffffff" stroke="#3b6fd4"/>
    <text x="130" y="128" text-anchor="middle" font-size="13" fill="#555">GPU 0</text>
    <text x="330" y="128" text-anchor="middle" font-size="13" fill="#555">GPU 1</text>
    <rect x="70" y="140" width="120" height="30" rx="4" fill="#c9dcff"/><text x="130" y="160" text-anchor="middle" font-size="12" fill="#1a2b4a">完整模型副本</text>
    <rect x="270" y="140" width="120" height="30" rx="4" fill="#c9dcff"/><text x="330" y="160" text-anchor="middle" font-size="12" fill="#1a2b4a">完整模型副本</text>
    <rect x="70" y="180" width="120" height="26" rx="4" fill="#ffe7b3"/><text x="130" y="198" text-anchor="middle" font-size="11" fill="#7a5200">batch 分片 A</text>
    <rect x="270" y="180" width="120" height="26" rx="4" fill="#ffe7b3"/><text x="330" y="198" text-anchor="middle" font-size="11" fill="#7a5200">batch 分片 B</text>
    <path d="M205 250 H255" stroke="#d43b3b" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M255 258 H205" stroke="#d43b3b" stroke-width="2" marker-end="url(#ar)"/>
    <text x="230" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#d43b3b">All-Reduce 梯度</text>
  </g>

  <!-- Tensor Parallel -->
  <g>
    <rect x="470" y="60" width="400" height="220" rx="10" fill="#eefaf0" stroke="#2f9e5a" stroke-width="1.5"/>
    <text x="670" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2b4a">Tensor Parallel (TP) — 拆单层权重矩阵</text>
    <rect x="495" y="105" width="150" height="120" rx="8" fill="#ffffff" stroke="#2f9e5a"/>
    <rect x="695" y="105" width="150" height="120" rx="8" fill="#ffffff" stroke="#2f9e5a"/>
    <text x="570" y="128" text-anchor="middle" font-size="13" fill="#555">GPU 0</text>
    <text x="770" y="128" text-anchor="middle" font-size="13" fill="#555">GPU 1</text>
    <rect x="510" y="140" width="120" height="66" rx="4" fill="#bfe8cd"/><text x="570" y="170" text-anchor="middle" font-size="12" fill="#1a4a2b">W 左半列</text><text x="570" y="188" text-anchor="middle" font-size="11" fill="#3a6a4a">同一 batch</text>
    <rect x="710" y="140" width="120" height="66" rx="4" fill="#bfe8cd"/><text x="770" y="170" text-anchor="middle" font-size="12" fill="#1a4a2b">W 右半列</text><text x="770" y="188" text-anchor="middle" font-size="11" fill="#3a6a4a">同一 batch</text>
    <path d="M645 250 H695" stroke="#d43b3b" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M695 258 H645" stroke="#d43b3b" stroke-width="2" marker-end="url(#ar)"/>
    <text x="670" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#d43b3b">All-Reduce 激活 (每层 2 次)</text>
  </g>

  <!-- Pipeline Parallel -->
  <g>
    <rect x="30" y="305" width="400" height="225" rx="10" fill="#fff3f0" stroke="#d4763b" stroke-width="1.5"/>
    <text x="230" y="333" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2b4a">Pipeline Parallel (PP) — 拆层 (深度)</text>
    <rect x="55" y="350" width="150" height="150" rx="8" fill="#ffffff" stroke="#d4763b"/>
    <rect x="255" y="350" width="150" height="150" rx="8" fill="#ffffff" stroke="#d4763b"/>
    <text x="130" y="373" text-anchor="middle" font-size="13" fill="#555">GPU 0</text>
    <text x="330" y="373" text-anchor="middle" font-size="13" fill="#555">GPU 1</text>
    <rect x="70" y="385" width="120" height="26" rx="4" fill="#ffd4bf"/><text x="130" y="403" text-anchor="middle" font-size="12" fill="#7a3a20">Layer 1–8</text>
    <rect x="70" y="418" width="120" height="26" rx="4" fill="#ffd4bf"/><text x="130" y="436" text-anchor="middle" font-size="12" fill="#7a3a20">Layer 9–16</text>
    <rect x="270" y="385" width="120" height="26" rx="4" fill="#ffd4bf"/><text x="330" y="403" text-anchor="middle" font-size="12" fill="#7a3a20">Layer 17–24</text>
    <rect x="270" y="418" width="120" height="26" rx="4" fill="#ffd4bf"/><text x="330" y="436" text-anchor="middle" font-size="12" fill="#7a3a20">Layer 25–32</text>
    <path d="M205 470 H255" stroke="#7a3a20" stroke-width="2" marker-end="url(#ar)"/>
    <text x="230" y="490" text-anchor="middle" font-size="12" font-weight="700" fill="#7a3a20">send/recv 激活 (P2P)</text>
  </g>

  <!-- Expert Parallel -->
  <g>
    <rect x="470" y="305" width="400" height="225" rx="10" fill="#f5f0ff" stroke="#7a4bd4" stroke-width="1.5"/>
    <text x="670" y="333" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2b4a">Expert Parallel (EP, MoE) — 拆专家</text>
    <rect x="495" y="350" width="150" height="150" rx="8" fill="#ffffff" stroke="#7a4bd4"/>
    <rect x="695" y="350" width="150" height="150" rx="8" fill="#ffffff" stroke="#7a4bd4"/>
    <text x="570" y="373" text-anchor="middle" font-size="13" fill="#555">GPU 0</text>
    <text x="770" y="373" text-anchor="middle" font-size="13" fill="#555">GPU 1</text>
    <rect x="510" y="385" width="120" height="30" rx="4" fill="#e0d4ff"/><text x="570" y="405" text-anchor="middle" font-size="12" fill="#3a2b6a">Expert 0,1</text>
    <rect x="710" y="385" width="120" height="30" rx="4" fill="#e0d4ff"/><text x="770" y="405" text-anchor="middle" font-size="12" fill="#3a2b6a">Expert 2,3</text>
    <path d="M630 435 H710" stroke="#d43b3b" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M710 452 H630" stroke="#d43b3b" stroke-width="2" marker-end="url(#ar)"/>
    <text x="670" y="490" text-anchor="middle" font-size="12" font-weight="700" fill="#d43b3b">All-to-All 路由 token</text>
  </g>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#d43b3b"/></marker>
  </defs>
</svg>
