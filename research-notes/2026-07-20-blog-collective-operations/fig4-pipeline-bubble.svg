<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1a2b4a">Pipeline 气泡 (bubble)：GPipe 微批切分 (4 stage, 4 microbatch)</text>

  <!-- axes -->
  <text x="40" y="70" font-size="13" fill="#555">阶段↓ / 时间→</text>
  <!-- rows -->
  <g font-size="12" fill="#1a2b4a">
    <text x="30" y="110">S0</text><text x="30" y="150">S1</text><text x="30" y="190">S2</text><text x="30" y="230">S3</text>
  </g>

  <!-- forward blocks: color by microbatch -->
  <!-- helper: each cell 46 wide -->
  <!-- Row S0 -->
  <g>
    <rect x="60" y="92" width="46" height="30" fill="#3b6fd4"/><text x="83" y="112" text-anchor="middle" font-size="11" fill="#fff">F0</text>
    <rect x="106" y="92" width="46" height="30" fill="#5b8ae0"/><text x="129" y="112" text-anchor="middle" font-size="11" fill="#fff">F1</text>
    <rect x="152" y="92" width="46" height="30" fill="#7ba5ea"/><text x="175" y="112" text-anchor="middle" font-size="11" fill="#fff">F2</text>
    <rect x="198" y="92" width="46" height="30" fill="#9bc0f4"/><text x="221" y="112" text-anchor="middle" font-size="11" fill="#333">F3</text>
    <rect x="612" y="92" width="46" height="30" fill="#d4763b"/><text x="635" y="112" text-anchor="middle" font-size="11" fill="#fff">B0</text>
    <rect x="658" y="92" width="46" height="30" fill="#e08f5b"/><text x="681" y="112" text-anchor="middle" font-size="11" fill="#fff">B1</text>
    <rect x="704" y="92" width="46" height="30" fill="#eaa87b"/><text x="727" y="112" text-anchor="middle" font-size="11" fill="#333">B2</text>
    <rect x="750" y="92" width="46" height="30" fill="#f4c19b"/><text x="773" y="112" text-anchor="middle" font-size="11" fill="#333">B3</text>
  </g>
  <!-- Row S1 -->
  <g>
    <rect x="106" y="132" width="46" height="30" fill="#3b6fd4"/><text x="129" y="152" text-anchor="middle" font-size="11" fill="#fff">F0</text>
    <rect x="152" y="132" width="46" height="30" fill="#5b8ae0"/><text x="175" y="152" text-anchor="middle" font-size="11" fill="#fff">F1</text>
    <rect x="198" y="132" width="46" height="30" fill="#7ba5ea"/><text x="221" y="152" text-anchor="middle" font-size="11" fill="#fff">F2</text>
    <rect x="244" y="132" width="46" height="30" fill="#9bc0f4"/><text x="267" y="152" text-anchor="middle" font-size="11" fill="#333">F3</text>
    <rect x="566" y="132" width="46" height="30" fill="#d4763b"/><text x="589" y="152" text-anchor="middle" font-size="11" fill="#fff">B0</text>
    <rect x="612" y="132" width="46" height="30" fill="#e08f5b"/><text x="635" y="152" text-anchor="middle" font-size="11" fill="#fff">B1</text>
    <rect x="658" y="132" width="46" height="30" fill="#eaa87b"/><text x="681" y="152" text-anchor="middle" font-size="11" fill="#333">B2</text>
    <rect x="704" y="132" width="46" height="30" fill="#f4c19b"/><text x="727" y="152" text-anchor="middle" font-size="11" fill="#333">B3</text>
  </g>
  <!-- Row S2 -->
  <g>
    <rect x="152" y="172" width="46" height="30" fill="#3b6fd4"/><text x="175" y="192" text-anchor="middle" font-size="11" fill="#fff">F0</text>
    <rect x="198" y="172" width="46" height="30" fill="#5b8ae0"/><text x="221" y="192" text-anchor="middle" font-size="11" fill="#fff">F1</text>
    <rect x="244" y="172" width="46" height="30" fill="#7ba5ea"/><text x="267" y="192" text-anchor="middle" font-size="11" fill="#fff">F2</text>
    <rect x="290" y="172" width="46" height="30" fill="#9bc0f4"/><text x="313" y="192" text-anchor="middle" font-size="11" fill="#333">F3</text>
    <rect x="520" y="172" width="46" height="30" fill="#d4763b"/><text x="543" y="192" text-anchor="middle" font-size="11" fill="#fff">B0</text>
    <rect x="566" y="172" width="46" height="30" fill="#e08f5b"/><text x="589" y="192" text-anchor="middle" font-size="11" fill="#fff">B1</text>
    <rect x="612" y="172" width="46" height="30" fill="#eaa87b"/><text x="635" y="192" text-anchor="middle" font-size="11" fill="#333">B2</text>
    <rect x="658" y="172" width="46" height="30" fill="#f4c19b"/><text x="681" y="192" text-anchor="middle" font-size="11" fill="#333">B3</text>
  </g>
  <!-- Row S3 -->
  <g>
    <rect x="198" y="212" width="46" height="30" fill="#3b6fd4"/><text x="221" y="232" text-anchor="middle" font-size="11" fill="#fff">F0</text>
    <rect x="244" y="212" width="46" height="30" fill="#5b8ae0"/><text x="267" y="232" text-anchor="middle" font-size="11" fill="#fff">F1</text>
    <rect x="290" y="212" width="46" height="30" fill="#7ba5ea"/><text x="313" y="232" text-anchor="middle" font-size="11" fill="#fff">F2</text>
    <rect x="336" y="212" width="46" height="30" fill="#9bc0f4"/><text x="359" y="232" text-anchor="middle" font-size="11" fill="#333">F3</text>
    <rect x="474" y="212" width="46" height="30" fill="#d4763b"/><text x="497" y="232" text-anchor="middle" font-size="11" fill="#fff">B0</text>
    <rect x="520" y="212" width="46" height="30" fill="#e08f5b"/><text x="543" y="232" text-anchor="middle" font-size="11" fill="#fff">B1</text>
    <rect x="566" y="212" width="46" height="30" fill="#eaa87b"/><text x="589" y="232" text-anchor="middle" font-size="11" fill="#333">B2</text>
    <rect x="612" y="212" width="46" height="30" fill="#f4c19b"/><text x="635" y="232" text-anchor="middle" font-size="11" fill="#333">B3</text>
  </g>

  <!-- bubble hatch areas -->
  <g fill="#eee" stroke="#bbb" stroke-dasharray="3">
    <rect x="244" y="92" width="368" height="30" opacity="0.55"/>
    <rect x="290" y="132" width="276" height="30" opacity="0.55"/>
    <rect x="336" y="172" width="184" height="30" opacity="0.55"/>
    <rect x="382" y="212" width="92" height="30" opacity="0.55"/>
    <rect x="60" y="132" width="46" height="30" opacity="0.55"/>
    <rect x="60" y="172" width="92" height="30" opacity="0.55"/>
    <rect x="60" y="212" width="138" height="30" opacity="0.55"/>
  </g>

  <text x="440" y="290" text-anchor="middle" font-size="13" fill="#888">灰色斜纹 = 气泡（GPU 空转）</text>
  <text x="450" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2b4a">气泡占比 = (P−1)/(m+P−1)</text>
  <text x="450" y="356" text-anchor="middle" font-size="13" fill="#555">P=stage 数, m=microbatch 数。增大 m 摊薄气泡；1F1B / interleaved 调度进一步压缩</text>
  <text x="450" y="392" text-anchor="middle" font-size="12" fill="#7a3a20">此例 P=4, m=4 → 气泡 = 3/7 ≈ 43%；若 m=16 → 3/19 ≈ 16%</text>
</svg>
