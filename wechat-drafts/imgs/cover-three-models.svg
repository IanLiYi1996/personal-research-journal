<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1080" height="600" fill="url(#bg)"/>
  <!-- faint grid -->
  <g stroke="#1e2a44" stroke-width="1" opacity="0.5">
    <line x1="0" y1="150" x2="1080" y2="150"/><line x1="0" y1="300" x2="1080" y2="300"/><line x1="0" y1="450" x2="1080" y2="450"/>
  </g>
  <!-- top tag -->
  <text x="70" y="92" font-family="'Noto Sans CJK SC', Arial, sans-serif" font-size="26" fill="#64748b" letter-spacing="4">2026 · 07 · 开放权重</text>
  <!-- title -->
  <text x="68" y="188" font-family="'Noto Sans CJK SC', Arial, sans-serif" font-size="70" font-weight="800" fill="#f1f5f9">两周，三个开源巨兽</text>
  <!-- three bars -->
  <g font-family="'Noto Sans CJK SC', Arial, sans-serif">
    <rect x="70" y="250" width="520" height="70" rx="10" fill="url(#g1)" filter="url(#glow)"/>
    <text x="96" y="296" font-size="34" font-weight="700" fill="#0b1220">Inkling</text>
    <text x="560" y="296" font-size="30" font-weight="800" fill="#0b1220" text-anchor="end">975B</text>

    <rect x="70" y="340" width="410" height="70" rx="10" fill="url(#g2)" filter="url(#glow)"/>
    <text x="96" y="386" font-size="34" font-weight="700" fill="#0b1220">GLM-5.2</text>
    <text x="450" y="386" font-size="30" font-weight="800" fill="#0b1220" text-anchor="end">753B</text>

    <rect x="70" y="430" width="720" height="70" rx="10" fill="url(#g3)" filter="url(#glow)"/>
    <text x="96" y="476" font-size="34" font-weight="700" fill="#0b1220">Kimi K3</text>
    <text x="760" y="476" font-size="30" font-weight="800" fill="#0b1220" text-anchor="end">2.8T</text>
  </g>
  <!-- side labels -->
  <g font-family="'Noto Sans CJK SC', Arial, sans-serif" font-size="22" fill="#94a3b8">
    <text x="1010" y="298" text-anchor="end">Apache 2.0</text>
    <text x="1010" y="388" text-anchor="end">MIT</text>
    <text x="1010" y="478" text-anchor="end">首个开源 3T 级</text>
  </g>
  <text x="70" y="560" font-family="'Noto Sans CJK SC', Arial, sans-serif" font-size="24" fill="#475569">Inkling · GLM-5.2 · Kimi K3　一手资料横评</text>
</svg>
